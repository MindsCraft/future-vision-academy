<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Vision Academy — Global Competitor Moodboard Gallery</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131b2e;
      --surface-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      padding: 2.5rem 1.5rem;
      line-height: 1.5;
    }
    .header {
      max-width: 1400px;
      margin: 0 auto 2rem auto;
      text-align: center;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 700px;
      margin: 0 auto 1.5rem auto;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .search-input {
      padding: 0.6rem 1.2rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 9999px;
      color: var(--text-main);
      font-size: 0.95rem;
      min-width: 280px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .filter-btn {
      padding: 0.5rem 1rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #0b0f19;
      border-color: var(--primary);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
      border-color: #334155;
    }
    .card-thumb {
      width: 100%;
      height: 220px;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transition: transform 0.3s ease;
    }
    .card:hover .card-thumb img {
      transform: scale(1.03);
    }
    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }
    .card-sis {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex-grow: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--surface-border);
    }
    .card-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .card-link:hover {
      text-decoration: underline;
    }
    .view-screen-btn {
      color: var(--text-muted);
      font-size: 0.8rem;
      background: none;
      border: none;
      cursor: pointer;
    }
    .view-screen-btn:hover {
      color: #fff;
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .modal.open {
      display: flex;
    }
    .modal-content {
      max-width: 90vw;
      max-height: 90vh;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      overflow: auto;
      position: relative;
    }
    .modal-content img {
      width: 100%;
      height: auto;
      display: block;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      font-size: 1.5rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Future Vision Academy — 50 Global Competitors Moodboard</h1>
    <p>Visual architecture, UX patterns, and School Information System (SIS) benchmark of top global academies and international schools across the Americas, Europe, Middle East, and East Asia.</p>
    
    <div class="controls">
      <input type="text" id="search" class="search-input" placeholder="Search by school, country, or SIS (e.g. Veracross, Dubai, Tokyo, OpenApply)..." oninput="filterCards()">
      <button class="filter-btn active" onclick="setRegion('all')">All (50)</button>
      <button class="filter-btn" onclick="setRegion('Dubai & Gulf')">Dubai & Gulf (8)</button>
      <button class="filter-btn" onclick="setRegion('East Asia')">Japan & Korea (5)</button>
      <button class="filter-btn" onclick="setRegion('USA')">North America (10)</button>
      <button class="filter-btn" onclick="setRegion('UK')">UK & Europe (10)</button>
      <button class="filter-btn" onclick="setRegion('South Asia')">South Asia & BD (7)</button>
    </div>
  </div>

  <div class="grid" id="cardGrid">
    <!-- Rendered via JS -->
  </div>

  <div class="modal" id="imgModal" onclick="closeModal(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <img id="modalImg" src="" alt="Screenshot">
    </div>
  </div>

  <script>
    const schools = [
      { id: "01_phillips_exeter", name: "Phillips Exeter Academy", region: "USA", sis: "Blackbaud / Custom Harkness", url: "https://www.exeter.edu", desc: "Minimalist, editorial typography, strong focus on Harkness discussion learning method." },
      { id: "02_phillips_andover", name: "Phillips Academy Andover", region: "USA", sis: "Veracross / Slate Admissions", url: "https://www.andover.edu", desc: "Full-width visual hero, dynamic filterable news feed, floating ribbon for application." },
      { id: "03_eton_college", name: "Eton College", region: "UK", sis: "Custom Portal & OpenApply", url: "https://www.etoncollege.com", desc: "Quintessential British heritage aesthetic; deep Eton blue and gold accents, historical crests." },
      { id: "04_harrow_school", name: "Harrow School", region: "UK", sis: "iSAMS & Interactive School CMS", url: "https://www.harrowschool.org.uk", desc: "Modern interactive cards breaking down massive campus information with subtle scroll animations." },
      { id: "05_wellington_college", name: "Wellington College", region: "UK", sis: "Engage / Firefly", url: "https://www.wellingtoncollege.org.uk", desc: "High-contrast yellow and navy branding, strong emphasis on student wellbeing and innovation." },
      { id: "06_choate_rosemary", name: "Choate Rosemary Hall", region: "USA", sis: "Veracross", url: "https://www.choate.edu", desc: "Fluid layouts, clean contemporary lines, interactive student quote and video carousels." },
      { id: "07_deerfield_academy", name: "Deerfield Academy", region: "USA", sis: "Finalsite / Veracross", url: "https://www.deerfield.edu", desc: "Earthy green/stone tones, high-res drone footage of campus, fast sticky navigation bar." },
      { id: "08_lawrenceville", name: "Lawrenceville School", region: "USA", sis: "Blackbaud OnSuite", url: "https://www.lawrenceville.org", desc: "Red and black bold aesthetic, modular bento-box grid layouts for academic announcements." },
      { id: "09_sevenoaks_school", name: "Sevenoaks School", region: "UK", sis: "iSAMS & SOCS", url: "https://www.sevenoaksschool.org", desc: "Understated British luxury, clean white space, excellent mobile responsive navigation." },
      { id: "10_cheltenham_ladies", name: "Cheltenham Ladies' College", region: "UK", sis: "iSAMS & Firefly", url: "https://www.cheltladiescollege.org", desc: "Emerald green motif, comprehensive virtual tour module, prominent admissions roadmap." },
      { id: "11_le_rosey", name: "Institut Le Rosey", region: "UK", sis: "Custom Swiss ERP", url: "https://www.rosey.ch/en/", desc: "Minimalist Swiss luxury aesthetic, bilingual toggles (FR/EN), full-screen campus photography." },
      { id: "12_aiglon_college", name: "Aiglon College", region: "UK", sis: "OpenApply & Toddle", url: "https://www.aiglon.ch", desc: "Alpine mountain visual identity, character-driven motto, integrated digital inquiry form." },
      { id: "13_dulwich_college", name: "Dulwich College", region: "UK", sis: "iSAMS & Finalsite", url: "https://www.dulwich.org.uk", desc: "Balances traditional discipline and heritage with modern 21st-century STEM/robotics showcase." },
      { id: "14_winchester_college", name: "Winchester College", region: "UK", sis: "Engage / SchoolBase", url: "https://www.winchestercollege.org", desc: "Muted classical typography, intellectual storytelling, comprehensive open-day RSVP." },
      { id: "15_horace_mann", name: "Horace Mann School", region: "USA", sis: "Blackbaud & Ravenna", url: "https://www.horacemann.org", desc: "Clean Manhattan preparatory layout, intuitive division tabs (Nursery, Lower, Middle, Upper)." },
      { id: "16_trinity_school_nyc", name: "Trinity School NYC", region: "USA", sis: "Veracross", url: "https://www.trinityschoolnyc.org", desc: "Deep blue and crisp white, emphasis on faculty credentials and collegiate matriculation." },
      { id: "17_groton_school", name: "Groton School", region: "USA", sis: "Finalsite & Veracross", url: "https://www.groton.org", desc: "Warm welcoming tone, clear scholarship and financial assistance guidelines (GRAIN initiative)." },
      { id: "18_upper_canada_college", name: "Upper Canada College", region: "USA", sis: "Blackbaud OnSuite", url: "https://www.ucc.on.ca", desc: "Rich royal navy palette, prominent IB pathway diagrams, interactive strategic plan." },
      { id: "19_singapore_american_school", name: "Singapore American School", region: "Asia", sis: "PowerSchool & OpenApply", url: "https://www.sas.edu.sg", desc: "Fast load times, vibrant community photos, clear admission readiness checklist." },
      { id: "20_uwcsea_singapore", name: "UWC South East Asia", region: "Asia", sis: "OpenApply & CiviCRM", url: "https://www.uwcsea.edu.sg", desc: "Global sustainability mission branding, interactive curriculum explorer with subject filters." },
      { id: "21_tanglin_trust", name: "Tanglin Trust School", region: "Asia", sis: "iSAMS & OpenApply", url: "https://www.tts.edu.sg", desc: "Dual-pathway showcase (A-Levels vs IB), comprehensive interactive fee calculator." },
      { id: "22_dubai_college", name: "Dubai College", region: "Dubai & Gulf", sis: "iSAMS & SOCS", url: "https://www.dubaicollege.org", desc: "High-impact video hero, KHDA Outstanding inspection rating prominently highlighted." },
      { id: "23_jess_dubai", name: "JESS Dubai", region: "Dubai & Gulf", sis: "Engage & Microsoft 365", url: "https://www.jess.sch.ae", desc: "Clean card-based layout, parent digital portal quick-links in top bar." },
      { id: "24_kings_school_dubai", name: "Kings' School Dubai", region: "Dubai & Gulf", sis: "iSAMS & Engage", url: "https://kings-edu.com/dubai/", desc: "Only school in Dubai to achieve 'Outstanding' DSIB rating every year; elegant British curriculum portal." },
      { id: "25_hk_international_school", name: "Hong Kong International School", region: "Asia", sis: "PowerSchool & Ravenna", url: "https://www.hkis.edu.hk", desc: "Asian-cosmopolitan aesthetic, multi-campus toggle (Repulse Bay & Tai Tam)." },
      { id: "26_chinese_intl_school_hk", name: "Chinese International School", region: "Asia", sis: "Veracross & OpenApply", url: "https://www.cis.edu.hk", desc: "Dual-language immersion storytelling, minimalist typography, calm earthy tones." },
      { id: "27_intl_school_bangkok", name: "International School Bangkok", region: "Asia", sis: "PowerSchool & OpenApply", url: "https://www.isb.ac.th", desc: "Tropical green campus photography, prominent community and parent association hub." },
      { id: "28_nist_intl_school", name: "NIST International School", region: "Asia", sis: "Veracross & ManageBac", url: "https://www.nist.ac.th", desc: "Cyan-blue branding, bold typography, smooth off-canvas mobile drawer with quick actions." },
      { id: "29_alice_smith_school", name: "Alice Smith School", region: "Asia", sis: "iSAMS & Firefly", url: "https://www.alice-smith.edu.my", desc: "Distinctive teal and navy branding, strong dedicated early-years learning showcase." },
      { id: "30_jakarta_intercultural", name: "Jakarta Intercultural School", region: "Asia", sis: "PowerSchool & OpenApply", url: "https://www.jisedu.or.id", desc: "Dynamic video reels, rich student achievement stats, persistent floating inquiry widget." },
      { id: "31_british_school_delhi", name: "The British School New Delhi", region: "South Asia", sis: "Toddle & OpenApply", url: "https://www.british-school.org", desc: "Award-winning contemporary campus architecture highlighted front-and-center." },
      { id: "32_woodstock_school", name: "Woodstock School", region: "South Asia", sis: "Veracross & ManageBac", url: "https://www.woodstockschool.in", desc: "Himalayan scenery, deep legacy storytelling, residential safety focus." },
      { id: "33_dais_mumbai", name: "Dhirubhai Ambani Intl School", region: "South Asia", sis: "Custom ERP & SAP", url: "https://www.dais.edu.in", desc: "Prestigious maroon and gold branding, board exam topper highlights directly on homepage." },
      { id: "34_doon_school", name: "The Doon School", region: "South Asia", sis: "Custom Campus ERP", url: "https://www.doonschool.com", desc: "Heritage Indian academy, classical typography, focus on discipline and alumni achievements." },
      { id: "35_aitchison_college", name: "Aitchison College", region: "South Asia", sis: "Custom Portal", url: "https://www.aitchison.edu.pk", desc: "Historic colonial architecture, active notice bulletin marquee, comprehensive sports diary." },
      { id: "36_rajuk_uttara_model", name: "RAJUK Uttara Model College", region: "South Asia", sis: "Custom College ERP & Board Portal", url: "https://rajukcollege.edu.bd", desc: "Top premier national model college in Dhaka; high-volume notice engine and lottery result integration." },
      { id: "37_isd_dhaka", name: "International School Dhaka", region: "South Asia", sis: "OpenApply & ManageBac", url: "https://www.isdbd.org", desc: "Sleek international IB styling, Bashundhara campus showcase, streamlined inquiry form." },
      { id: "38_st_pauls_school", name: "St Paul's School", region: "UK", sis: "iSAMS & Firefly", url: "https://www.stpaulsschool.org.uk", desc: "High-contrast black, white, and red; prominent intellectual thought leadership articles." },
      { id: "39_harvard_westlake", name: "Harvard-Westlake School", region: "USA", sis: "Blackbaud & Veracross", url: "https://www.hw.com", desc: "Ultra-crisp typography, fast interactive stats ribbon, student arts and sports highlights." },
      { id: "40_nord_anglia_shanghai", name: "British Intl School Shanghai", region: "Asia", sis: "Nord Anglia & iSAMS", url: "https://www.nordangliaeducation.com/biss-puxi", desc: "Global network backing, interactive curriculum guide, multi-channel parent communication hub." },
      { id: "41_nas_dubai", name: "Nord Anglia Intl School Dubai", region: "Dubai & Gulf", sis: "Nord Anglia, iSAMS & OpenApply", url: "https://www.nordangliaeducation.com/nas-dubai", desc: "Warm crimson/gold royal palette, global collaborations with Juilliard, MIT STEAM, and UNICEF." },
      { id: "42_gems_world_dubai", name: "GEMS World Academy Dubai", region: "Dubai & Gulf", sis: "GEMS OASIS & ManageBac", url: "https://www.gemsworldacademy-dubai.com", desc: "Futuristic navy/electric cyan visual identity, planetarium and robotics center, instant WhatsApp inquiry." },
      { id: "43_nlcs_dubai", name: "NLCS Dubai", region: "Dubai & Gulf", sis: "iSAMS & Firefly", url: "https://nlcsdubai.ae", desc: "Classical British scholarship in modern Arabian architecture; heraldic branding and academic rigor." },
      { id: "44_cranleigh_abu_dhabi", name: "Cranleigh Abu Dhabi", region: "Dubai & Gulf", sis: "Engage & OpenApply", url: "https://www.cranleigh.ae", desc: "Saadiyat Cultural District architectural aesthetics, aerial campus visuals, clear admissions timeline." },
      { id: "45_swiss_school_dubai", name: "Swiss Intl Scientific School Dubai", region: "Dubai & Gulf", sis: "OpenApply & ManageBac", url: "https://sisd.ae", desc: "Swiss precision design, multilingual immersion switcher (French, German, English), Olympic sports." },
      { id: "46_asij_tokyo", name: "American School in Japan", region: "East Asia", sis: "Veracross & Finalsite", url: "https://www.asij.ac.jp", desc: "Japanese-American design fusion, slate/crimson tones, human-centric student documentary reels." },
      { id: "47_yis_japan", name: "Yokohama International School", region: "East Asia", sis: "Toddle & PowerSchool", url: "https://www.yis.ac.jp", desc: "Kengo Kuma designed timber campus, calming natural organic palette, inquiry-based learning." },
      { id: "48_seoul_foreign_school", name: "Seoul Foreign School", region: "East Asia", sis: "Veracross & Ravenna", url: "https://www.seoulforeign.org", desc: "Founded 1912; bridges legacy with Seoul high-tech; dual British and American track switcher." },
      { id: "49_chadwick_intl_korea", name: "Chadwick International", region: "East Asia", sis: "PowerSchool & OpenApply", url: "https://www.chadwickinternational.org", desc: "Songdo smart-city campus, Cisco TelePresence connected rooms, experiential learning showcase." },
      { id: "50_korea_intl_school", name: "Korea International School", region: "East Asia", sis: "PowerSchool & Google Education", url: "https://www.kis.or.kr", desc: "Engineering makerspaces, robotics hubs, transparent Ivy League and SKY university matriculation." }
    ];

    let currentRegion = 'all';

    function renderGrid(items) {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = items.map(s => `
        <div class="card">
          <div class="card-thumb">
            <img src="screenshots/${s.id}.png" alt="${s.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'400\\' height=\\'250\\' viewBox=\\'0 0 400 250\\'><rect fill=\\'%231e293b\\' width=\\'400\\' height=\\'250\\'/><text fill=\\'%2394a3b8\\' font-family=\\'sans-serif\\' font-size=\\'16\\' dy=\\'10.5\\' font-weight=\\'bold\\' x=\\'50%\\' y=\\'50%\\' text-anchor=\\'middle\\'>Capturing Screenshot...</text></svg>'">
          </div>
          <div class="card-body">
            <div class="card-top">
              <span class="card-title">${s.name}</span>
              <span class="badge">${s.region}</span>
            </div>
            <div class="card-sis">SIS: ${s.sis}</div>
            <p class="card-desc">${s.desc}</p>
            <div class="card-footer">
              <a href="${s.url}" target="_blank" rel="noreferrer" class="card-link">Visit Website ↗</a>
              <button class="view-screen-btn" onclick="openModal('screenshots/${s.id}.png')">Full Preview</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setRegion(region) {
      currentRegion = region;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      filterCards();
    }

    function filterCards() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = schools.filter(s => {
        const matchesRegion = currentRegion === 'all' || s.region === currentRegion;
        const matchesQuery = s.name.toLowerCase().includes(q) || s.sis.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q);
        return matchesRegion && matchesQuery;
      });
      renderGrid(filtered);
    }

    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imgModal').classList.add('open');
    }

    function closeModal(e) {
      if (!e || e.target.id === 'imgModal' || e.target.classList.contains('modal-close')) {
        document.getElementById('imgModal').classList.remove('open');
      }
    }

    // Initial render
    renderGrid(schools);
  </script>
</body>
</html>
